[package]
name = "flux"
version = "0.1.0"
edition = "2024"
license.workspace = true

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
flux-analysis = { version = "0.1.0", path = "../flux-analysis" }
flux-assets = { version = "0.1.0", path = "../flux-assets" }
flux-core = { version = "0.1.0", path = "../flux-core" }
flux-engine = { version = "0.1.0", path = "../flux-engine" }
flux-score = { version = "0.1.0", path = "../flux-score" }
flux-setup = { version = "0.1.0", path = "../flux-setup" }
flux-sfz = { version = "0.1.0", path = "../flux-sfz" }
flux-vst3 = { version = "0.1.0", path = "../flux-vst3" }
cpal = "0.18.2"
eframe = "0.36.2"
libc = "0.2.190"
midir = "0.11.0"
parking_lot = "0.12.5"
png = "0.18.1"
raw-window-handle = "0.6.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

[lints]
workspace = true

[dev-dependencies]
# headless GUI snapshot tests (src/gui/tests.rs): the GUI drawn by wgpu's software adapter, no window
egui_kittest = { version = "0.36.2", features = ["wgpu", "snapshot"] }

[target.'cfg(windows)'.dependencies]
# the installed build (`dist`): the terminal it was started from, and a box for errors with none
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Console", "Win32_UI_WindowsAndMessaging"] }
# Setup's folder picker (the Windows one; the default features only choose a Linux backend)
rfd = { version = "0.17.2", default-features = false }

[features]
# the build that is released: a windowed program carrying its own Setup (src/dist.rs, build.rs)
dist = ["dep:zip"]

[build-dependencies]
# the Windows icon and version information (build.rs)
embed-resource = "3"
# `dist`: the library's own files, zipped into the executable for Setup (build.rs)
zip = { version = "8.6.0", default-features = false, features = ["deflate-flate2-zlib-rs"], optional = true }
