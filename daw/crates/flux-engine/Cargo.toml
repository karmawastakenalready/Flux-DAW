[package]
name = "flux-engine"
version = "0.1.0"
edition = "2024"
license.workspace = true

[dependencies]
anyhow = "1.0.104"
flux-core = { version = "0.1.0", path = "../flux-core" }
flux-nam = { version = "0.1.0", path = "../flux-nam" }
flux-vst3 = { version = "0.1.0", path = "../flux-vst3" }
ebur128 = "0.1.10"
hound = "3.5.1"
libloading = "0.9.0"
midly = "0.5.3"
rustfft = "6.4.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
claxon = "0.4.3"
lewton = "0.10.2"

[target.'cfg(windows)'.dependencies.windows-sys]
version = "0.61.2"
features = ["Win32_Foundation", "Win32_System_Com", "Win32_UI_Shell"]

[dev-dependencies]
tempfile = "3.27.0"

[lints]
workspace = true
