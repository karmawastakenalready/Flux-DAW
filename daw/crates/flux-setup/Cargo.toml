[package]
name = "flux-setup"
description = "Installing Flux: the app, its instrument library, agent (MCP client) connections and update checks."
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
anyhow = "1.0.104"
flux-assets = { path = "../flux-assets" }
flux-engine = { path = "../flux-engine" }
jsonc-parser = { version = "0.34.0", features = ["cst", "serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
toml_edit = "0.25.15"
zip = { version = "8.6.0", default-features = false, features = ["deflate-flate2"] }

[target.'cfg(windows)'.dependencies]
mslnk = "0.1.8"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_Diagnostics_ToolHelp", "Win32_Storage_FileSystem", "Win32_System_Threading", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
winreg = "0.56.0"

[dev-dependencies]
tempfile = "3.27.0"
