[package]
name = "flux-analysis"
description = "Measurements on rendered audio: game-wide loudness and loop seams, mastering reports, match EQ, reference matching, mix checks (masking, mud, harshness, smearing, mono) with fixes, spectrograms, stem balance, time effects and instrument report cards."
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
anyhow = "1.0.104"
flux-engine = { version = "0.1.0", path = "../flux-engine" }
claxon = "0.4.3"
ebur128 = "0.1.10"
hound = "3.5.1"
libloading = "0.9.0"
png = "0.18.1"
rayon = "1.12.0"
regex = "1.11"
rustfft = "6.4.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

[dev-dependencies]
tempfile = "3.27.0"
