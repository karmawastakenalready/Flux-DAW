[package]
name = "flux-sfz"
description = "SFZ tooling: the patched instrument wrappers the songs use, and level/tuning/range fixes."
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
flux-engine = { version = "0.1.0", path = "../flux-engine" }
claxon = "0.4.3"
rustfft = "6.4.1"
serde = { version = "1.0.229", features = ["derive", "rc"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
thiserror = "2.0.21"
toml = { version = "1.1.7", default-features = false, features = ["parse", "serde", "preserve_order", "std"] }
