# cargo-about: the licenses of the crates compiled into the released Flux, gathered into the THIRD-PARTY-NOTICES.txt
# Setup installs beside flux.exe. The release workflow runs
#   cargo about generate -m crates/flux/Cargo.toml --features dist about.hbs -o notices.txt
# A crate under a license missing from `accepted` fails the release: check it allows commercial use and needs no
# share-alike before adding it (no GPL, LGPL, MPL or other copyleft licenses).

accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "Unlicense",
    "BSL-1.0",
    "Unicode-3.0",
    # the fonts egui embeds (epaint_default_fonts)
    "OFL-1.1",
    "Ubuntu-font-1.0",
]
targets = ["x86_64-pc-windows-msvc"]
ignore-dev-dependencies = true
ignore-build-dependencies = false
workarounds = ["ring", "rustls"]
