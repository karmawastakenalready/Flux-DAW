    { name = "trem", source = "instruments/VSCO-2-CE/ViolinEnsTrem.sfz", crossfade = true },
    { name = "spic", source = "instruments/VSCO-2-CE/ViolinEnsSpic.sfz" },
    { name = "pizz", source = "instruments/VSCO-2-CE/ViolinEnsPizz.sfz" },
