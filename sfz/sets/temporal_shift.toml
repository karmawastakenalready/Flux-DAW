# Instrument set "temporal_shift" (draft generated from instruments.py by sets_to_toml.py).
# Temporal Shift: orchestral instruments; the string and brass sections switch articulations with keyswitches 120 and up (first articulation = default).
#
# Paths are relative to the project root (the folder that holds instruments/), like paths in Flux projects.
# `flux sfz build temporal_shift` writes the wrappers to build/sfz/temporal_shift/ (see [set] output); wrap = "none"
# instruments are played from their source directly. Ranges and test notes are MIDI keys (note names such as
# "C4" also work). gm = [bank, program] is the General MIDI fallback.

[set]
description = "Temporal Shift: orchestral instruments; the string and brass sections switch articulations with keyswitches 120 and up (first articulation = default)."

[instruments.violin_solo]
library = "VSCO-2-CE"
wrap = "keyswitch"
articulations = [
    { name = "sus", source = "instruments/VSCO-2-CE/SViolinVib.sfz", crossfade = true },
    { name = "spic", source = "instruments/VSCO-2-CE/SViolinSpic.sfz" },
    { name = "pizz", source = "instruments/VSCO-2-CE/SViolinPizz.sfz" },
]
range = [55, 93]
test_note = 76
max_note_s = 10.0
gm = [0, 40]

[instruments.violins]
library = "VSCO-2-CE"
wrap = "keyswitch"
articulations = [
