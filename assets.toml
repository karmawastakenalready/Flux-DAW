# ---------------------------------------------------------------------------------------------------------------
# Packs: what Setup and Flux's Library window offer. Assets in no pack (test plugins, the retired Python
# pipeline, the UI fonts) are for developers only. Selections are the quick choices; "Everything" is every pack.
# ---------------------------------------------------------------------------------------------------------------

[[pack]]
id = "engine"
name = "Flux engine"
description = "sfizz, the sampler Flux plays every SFZ instrument with."
section = "core"
assets = ["sfizz"]

[[pack]]
id = "piano"
name = "Piano"
description = "Salamander Grand Piano: a Yamaha C5 concert grand, sampled note by note at 16 velocities."
assets = ["salamander-grand-piano"]

[[pack]]
id = "orchestra"
name = "Orchestra"
description = "Strings, woodwinds, brass, organ and orchestral percussion (Versilian Chamber Orchestra 2), and a solo cello."
assets = ["vsco-2-ce", "karoryfer-bigcat-cello"]

[[pack]]
id = "drums"
name = "Drums & percussion"
description = "A jazz drum kit with kick, snare and overhead microphones, and Sonic Pi's drum, loop and ambient one-shots."
assets = ["virtuosity-drums", "sonic-pi-samples"]

[[pack]]
id = "folk"
name = "Folk & early music"
description = "Folk harp, strumstick, psaltery, recorders and hand drums, a medieval lyre, a Hungarian zither and a plucked bass tagelharpa."
assets = ["vcsl", "cithara-barbarica", "hungarian-zither", "karoryfer-horse-pulse"]

[[pack]]
id = "guitars"
name = "Guitars & bass"
description = "A Hofner Club electric guitar and a Squier Jazz Bass, recorded direct."
assets = ["karoryfer-black-and-green-guitars", "karoryfer-growlybass"]

[[pack]]
id = "synths"
name = "Synths & textures"
description = "Analog synth sounds sampled from a transistor organ, organ, pad and pluck synths, and pads blown on water-filled bottles (played by Decent Sampler)."
assets = ["karoryfer-caveman-cosmonaut", "karoryfer-cowsynth", "decentsampler-bottles"]
needs = ["decent-sampler"]

[[pack]]
id = "voice"
name = "Voice"
description = "A sung legato vowel for choir-like lines."
assets = ["legato-vocal-tutorial"]

[[pack]]
id = "metal"
name = "Metal guitar rigs"
description = "6- and 8-string metal guitar samples played through captured Peavey 5150 amp rigs. Downloaded in your browser: METAL-GTX from its author's Google Drive, the amp captures from TONE3000 (free account)."
assets = ["metal-gtx", "nam-jp-5150-mesa", "nam-ob1-5150iii"]

[[pack]]
id = "surge-xt"
name = "Surge XT"
description = "A free, open-source hybrid synth with a large factory patch library."
section = "plugins"
assets = ["surge-xt"]

[[pack]]
id = "dexed"
name = "Dexed"
description = "A free, open-source FM synth modelled on the Yamaha DX7."
section = "plugins"
assets = ["dexed"]

[[pack]]
id = "vital"
name = "Vital"
description = "A wavetable synth; Flux loads its preset banks itself. Install it from vital.audio (free account)."
section = "plugins"
assets = ["vital"]

[[pack]]
id = "decent-sampler"
name = "Decent Sampler"
description = "A free sample player; Flux plays Decent Sampler libraries such as Bottles through it."
section = "plugins"
assets = ["decent-sampler"]

[[pack]]
id = "valhalla-supermassive"
name = "Valhalla Supermassive"
description = "A free reverb and delay; new Flux projects use it as their reverb."
section = "plugins"
assets = ["valhalla-supermassive"]

[[pack]]
id = "izotope-vinyl"
name = "iZotope Vinyl"
description = "A free vinyl and lo-fi effect."
section = "plugins"
assets = ["izotope-vinyl"]

[[pack]]
id = "stl-ignite-emissary"
name = "STL Ignite Emissary"
description = "A free tube guitar preamp, an impulse-response loader (NadIR) and cabinet impulse responses."
section = "plugins"
assets = ["stl-ignite-emissary"]

[[selection]]
id = "minimal"
name = "Minimal"
description = "A piano and drum one-shots: enough to try Flux."
assets = ["salamander-grand-piano", "sonic-pi-samples"]

[[selection]]
