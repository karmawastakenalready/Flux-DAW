# Third-party assets of the music project: where each one comes from, how to fetch and check it, and its license.
# Read by `flux assets status|fetch|verify|lock|repair|licenses` (crate flux-assets). Proposed location: the repo
# root (`assets.toml`); the lock (`assets.lock` + `assets.lock.d/`) is written next to it.
#
# Facts recorded here were taken from the installs on disk (git HEADs, sparse patterns, archive caches hashed with
# SHA-256 and compared with upstream MD5 lists, SFZ-branch files matched byte-for-byte against GitHub tree listings)
# on 2026-10-08. Licenses were read from the files on disk; see build/flux-assets_check/ for the evidence.

schema = 1

[policy]
# Official sources only. Every redirect hop is checked against this list, and every download is pinned by SHA-256
# (git: by commit id), so a host on this list cannot substitute other content.
allowed_hosts = [
    "github.com",
    "codeload.github.com",
    "*.githubusercontent.com",       # raw files and release assets (objects / release-assets)
    "drive.google.com",              # METAL-GTX: the author's site links its downloads on Google Drive
    "drive.usercontent.google.com",
    "unreal-instruments.wixsite.com", # METAL-GTX author's site (terms page)
    "www.tone3000.com",              # NAM capture pages (license terms)
    "support.spectrasonics.net",     # Omnisphere license terms
    "vital.audio",                   # Vital license terms
    "valhalladsp.com",               # Valhalla DSP terms of use
    "www.izotope.com",               # iZotope (Native Instruments USA) license agreement
    "www.stltones.com",              # STL Tones license agreements
]
approval_threshold = "2G"
download_dir = "tools/_dl"
usage_roots = [
    "daw/projects/*.flux.json",     # Flux projects (followed into sfz/ wrappers and sfz/rigs/*.rig.json)
    "pieces/*.py",                   # pipeline songs (string heuristic)
    "instruments.py",                # instrument sets of the pipeline songs (string heuristic)
]

[credits]
intro = """
Every sound library, amp capture, plugin, tool and font the music project uses: where it comes from and under which
license. Sound content that can end up in the game must allow commercial use (CC0, CC BY, MIT or similar);
non-commercial and share-alike material is not used. Freeware and purchased licenses are used only with the owner's
recorded approval."""

[[license]]
id = "LicenseRef-GeneralUser-GS-2.0"
name = "GeneralUser GS License v2.0"
family = "permissive"
url = "https://github.com/mrbumpy409/GeneralUser-GS/blob/main/documentation/LICENSE.txt"
match = ["GeneralUser GS", "License v2.0"]
summary = "Free use for private or commercial music; may be modified and repackaged. The author cannot vouch for the origin of every sample."

[[license]]
id = "LicenseRef-UnrealInstruments-Free"
name = "Unreal Instruments free-use terms"
family = "freeware"
url = "https://unreal-instruments.wixsite.com/unreal-instruments/about"
summary = "All libraries are free to use; works made with them may be used commercially; no credit needed; the data may not be modified or redistributed without permission (About page, in Japanese)."

[[license]]
id = "LicenseRef-TONE3000-T3K"
name = "TONE3000 T3K license"
family = "freeware"
url = "https://www.tone3000.com/"
match = ["T3K"]
summary = "Use the capture in software and publish the resulting audio without royalties or restrictions; do not upload, republish or distribute the capture file without the author's permission."

[[license]]
id = "LicenseRef-Spectrasonics-EULA"
name = "Spectrasonics Omnisphere 2 license (purchased)"
family = "proprietary"
url = "https://support.spectrasonics.net/manual/Omnisphere/legal/all.htm"
summary = "Sounds may be used inside original musical compositions, including game music. Not allowed: samples triggered directly by the game, sound effects, or multitrack releases that expose an Omnisphere part on its own."

[[license]]
id = "LicenseRef-Vital-EULA"
name = "Vital end user license agreement"
family = "freeware"
url = "https://vital.audio/eula"
summary = "Vital and its content may be used in commercial or non-commercial music and audio productions without permission, including to make samples for commercial products; presets, samples, wavetables, skins and LFOs made from unaltered Vital Audio content may not be redistributed."

[[license]]
id = "LicenseRef-Valhalla-Terms"
name = "Valhalla DSP terms of use"
family = "freeware"
url = "https://valhalladsp.com/?p=49"
summary = "Licensed for use within the user's own recording software and computers; Valhalla DSP owns the software; no license to redistribute it, including as part of other software such as video games or DAWs. The terms place no restriction on audio made with the plugins."

[[license]]
id = "LicenseRef-NI-iZotope-EULA"
name = "Native Instruments USA (formerly iZotope) end user license agreement"
family = "freeware"
url = "https://www.izotope.com/en/license-agreement"
summary = "Non-exclusive license to use the software (presets included) on one computer at a time; it may not be loaned, rented, leased or licensed to others. The agreement makes no claim on audio made with the software."

[[license]]
id = "LicenseRef-STL-Tones-EULA"
name = "STL Tones end user license agreement"
family = "freeware"
url = "https://www.stltones.com/pages/end-user-license-agreements"
summary = "STL Tones (US) Inc.: one user on one computer at a time (three activations); presets are part of the software, which may not be loaned, rented, leased, licensed, modified or decompiled. The agreement makes no claim on audio made with the software."

[[license]]
id = "LicenseRef-DecentSampler-Freeware"
name = "Decent Sampler (freeware, no published license)"
family = "freeware"
url = "https://www.decentsamples.com/product/decent-sampler-plugin/"
summary = "Free download from Decent Samples; no license text is published with the player. It plays sample libraries, each under its own license, and adds no sound of its own."

